let S,tt;const genRM=()=>String(Math.floor(10000000+Math.random()*89999999)).replace(/(\d{2})(?=\d)/g,'$1-'),fmtRM=v=>{const d=v.replace(/\D/g,'');return d.length==8?d.replace(/(\d{2})(?=\d)/g,'$1-'):d};
function init(){S={step:"poli",d:{},tk:null,log:[],tab:0,ch:"app",toast:null};
 bot("Assalamu’alaikum 👋 Selamat datang di layanan pendaftaran online RSI Siti Hajar Sidoarjo (simulasi).");ask();render()}
const bot=(t,o={})=>S.log.push({f:"bot",t,...o});
const ask=()=>bot(S.step=='pay'?payText():Q[S.step],{step:S.step});
function notify(t,acts){bot(t,{n:1,acts});S.toast=t;clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;render()},4500);render()}
function opts(){const s=S.step,p=P.find(x=>x.n==S.d.poli);
 if(s=="poli")return P.map(x=>[x.n,x.n]);
 if(s=="dokter")return p.d.map(x=>[x+" · "+(slots(x,p.k)[0]||"jadwal belum tersedia"),x]);
 if(s=="jam")return slots(S.d.dokter,P.find(x=>x.n==S.d.poli).k).map(x=>[x,x]);
 if(s=="rm")return[["Pasien lama (sudah punya No. RM)","lama"],["Pasien baru (buat No. RM baru)","baru"]];
 if(s=="jamin")return[["Umum / pribadi","Umum"],["BPJS Kesehatan","BPJS"]];
 if(s=='bayar')return['QRIS','Virtual Account','Transfer Bank','E-Wallet'].map(x=>[x,x]);
 if(s=='rujukan')return[['✅ Rujukan FKTP aktif (berlaku)','ok'],['⛔ Rujukan kedaluwarsa / belum ada','exp']];
 if(s=='pay')return[['✅ Simulasi: saya sudah bayar','ok'],['⏱️ Simulasi: pembayaran kedaluwarsa','exp']];
 return null}
function pick(v,l){S.log.push({f:'me',t:S.step=='pay'?(v=='ok'?'Saya sudah bayar ✅':'Pembayaran kedaluwarsa ⏱️'):(((opts()||[]).find(x=>x[1]==v)||[])[0]||l||v)});
 if(S.step=='pay'){if(v=='ok'){S.step='wait';bot('Memverifikasi pembayaran…');render();return setTimeout(()=>{bot(`✅ Pembayaran ${rp(FEE)} via ${S.pay.m} diterima. Nomor antrean diterbitkan.`);finish()},1000)}
  S.step='bayar';bot('⏱️ Pembayaran kedaluwarsa. Nomor antrean belum diterbitkan. Silakan pilih metode pembayaran lagi.');ask();return render()}
 if(S.step=='rujukan'){if(v=='exp'){S.step='jamin';bot('❌ Rujukan tidak berlaku. Silakan minta rujukan baru di FKTP (puskesmas/klinik) atau daftar sebagai pasien umum.');ask();return render()}return finish()}
 if(S.step=='rm'){if(v=='lama'){S.step='rmno';ask();return render()}v=genRM();bot('✅ No. RM baru diterbitkan: '+v)}
 if(S.step=='rmno'){S.d.rm=fmtRM(v);S.step='jamin';bot('No. RM '+S.d.rm+' ditemukan (simulasi) atas nama '+S.d.nama+'.');ask();return render()}
 S.d[S.step]=v;
 if(S.step=='jamin'&&v=='BPJS'){S.step='rujukan';bot('Penjamin BPJS: tidak ada biaya konsultasi. Siapkan kartu BPJS & surat rujukan.');ask();return render()}
 if(S.step=='bayar'){const r=()=>Math.floor(1000+Math.random()*9000);S.pay={m:v,va:'8808 '+r()+' '+r()+' '+r(),u:Math.floor(100+Math.random()*900)};S.step='pay';ask();return render()}
 S.step=ST[ST.indexOf(S.step)+1];ask();render()}
function send(v){v=v.trim();if(!v)return;if(S.step=="rmno"&&v.replace(/\D/g,"").length<6){S.log.push({f:"me",t:v});bot("No. RM tidak valid (minimal 6 digit), coba lagi.");return render()}
 if(S.step=="hp"&&v.replace(/\D/g,"").length<9){S.log.push({f:"me",t:v});bot("Nomor HP tidak valid, coba lagi.");return render()}
 pick(v)}
const tl=m=>m>=60?Math.round(m/60)+' jam':m+' menit';
function payText(app){const m=S.pay.m,t=rp(FEE);

function tipv(){const o=S.tpo===undefined?-1:S.tpo;return `<div class='info'>Informasi edukasi umum, bukan pengganti pemeriksaan dokter.</div>`+TIPS.map((x,i)=>`<div class='cd' style='padding:0;overflow:hidden'><div data-tp='${i}' style='cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px;background:linear-gradient(135deg,${x.c[0]},${x.c[1]});color:#fff'><span style='font-size:26px'>${x.i}</span><div style='flex:1'><small style='color:#fff;opacity:.85;margin:0'>${x.k}</small><b style='font-size:13px'>${x.t}</b></div><span>${i==o?'▾':'▸'}</span></div>${i==o?`<div style='padding:12px;line-height:1.6'>${x.b}<button class='btn ol' style='margin:10px 0 0;padding:8px' data-fs='${x.q}|0'>Lihat jadwal dokter terkait</button></div>`:''}</div>`).join('')}
function evv(){S.evs=S.evs||{};return `<div class='info'>Contoh agenda. Ganti dengan agenda resmi RSI Siti Hajar.</div>`+EV.map((e,i)=>`<div class='cd ev'><div class='dt'>${e.n}<b>${e.d}</b>NOV</div><div style='flex:1'><b style='font-size:13px'>${e.t}</b><small>📍 ${e.w}</small><button class='btn ${S.evs[i]?'':'ol'}' style='margin:8px 0 0;padding:7px' data-ev='${i}'>${S.evs[i]?'✓ Pengingat aktif':'🔔 Ingatkan Saya'}</button></div></div>`).join('')}
function hcv(){const b=S.hcb;
 if(b){const st=['Diajukan','Dikonfirmasi petugas','Perawat menuju lokasi','Selesai'],i=b.st;return `<div class='cd'><span class='bd ${i==3?'':'o'}'>${st[i]}</span><small>Kode Home Care</small><div class='big'>${b.code}</div><small style='margin-top:8px'>Layanan</small><b>${esc(b.svc)}</b><small>👤 ${esc(b.nama)}</small><small>📍 ${esc(b.al)}</small><small>🗓 ${esc(b.dt)} · ${esc(b.jam)}</small><div class='dots' style='margin-top:12px'>${st.map((_,k)=>`<i class='${k<=i?'f':''}'></i>`).join('')}</div></div>`+(i<3?`<button class='btn' data-hc='adv'>⏩ Simulasi: majukan status</button><button class='btn ol' data-hc='cancel'>Batalkan kunjungan</button>`:`<button class='btn' data-hc='new'>Ajukan kunjungan baru</button>`)}
 const d=new Date(),mn=d.toISOString().slice(0,10);d.setDate(d.getDate()+1);
 return `<div class='promo' style='background:linear-gradient(135deg,#6db52e,#1e6a1a)'><b>🏠 Home Care RSI Siti Hajar</b>Perawat datang ke rumah Anda. <span class='tg'>Contoh layanan</span></div><div class='cd' style='margin-top:12px'><label>Layanan</label><select id='hc1'>${HCS.map(x=>`<option>${x}</option>`).join('')}</select><label>Nama pasien</label><input type='text' id='hc2' value='${esc(S.user.nama)}'><label>Alamat lengkap</label><input type='text' id='hc3' placeholder='Jl. …, Sidoarjo'><label>Tanggal kunjungan</label><input type='date' id='hc4' min='${mn}' value='${d.toISOString().slice(0,10)}'><label>Jam kunjungan</label><select id='hc5'><option>08.00–10.00</option><option>10.00–12.00</option><option>12.00–14.30</option></select>${S.hce?`<div style='color:#c0392b;font-size:12px;margin-bottom:8px'>${S.hce}</div>`:''}<button class='btn' data-hc='go'>Ajukan Kunjungan</button></div><div class='info'>Home Care beroperasi setiap hari 08.00–14.30 WIB (sumber: situs RSI Siti Hajar). Pengajuan di simulator ini hanya contoh.</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-fs],[data-fk],[data-tp],[data-ev],[data-hc],[data-jg]');if(!b)return;const d=b.dataset,v=id=>(document.getElementById(id)||{}).value||'',ts=m=>{S.toast=m;clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;render()},2200)};
 if(d.fs!==undefined){const[q,j]=d.fs.split('|');S.jq=q;S.jt=+j||0;S.jd=-1;S.tab=9}
 else if(d.jg!==undefined){S.jd=+d.jg;S.jq='';S.jt=0;S.tab=9}
 else if(d.fk!==undefined)S.fk=d.fk;
 else if(d.tp!==undefined){S.tpo=S.tpo===+d.tp&&S.tab==11?-1:+d.tp;S.tab=11}
 else if(d.ev!==undefined){S.evs=S.evs||{};const i=+d.ev;S.evs[i]=!S.evs[i];ts(S.evs[i]?'🔔 Pengingat acara aktif (simulasi)':'Pengingat dibatalkan')}
 else if(d.hc){const k=d.hc;
  if(k=='go'){const al=v('hc3').trim();if(al.length<8)S.hce='Alamat lengkap wajib diisi.';else if(!v('hc4'))S.hce='Pilih tanggal kunjungan.';else{S.hce='';S.hcb={code:'HC'+Math.floor(10000+Math.random()*89999),svc:v('hc1'),nama:v('hc2'),al,dt:new Date(v('hc4')+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'}),jam:v('hc5')+' WIB',st:0};notify('🏠 Pengajuan Home Care '+S.hcb.code+' diterima. Petugas akan menghubungi Anda untuk konfirmasi jadwal.')}}
  else if(k=='adv'){const h=S.hcb;h.st++;notify(['','✅ Home Care '+h.code+' dikonfirmasi. Perawat akan datang '+h.dt+', '+h.jam+'.','🚗 Perawat Home Care sedang menuju lokasi Anda. Mohon siapkan kartu identitas dan rekam medis.','🙏 Kunjungan Home Care selesai. Terima kasih, semoga lekas sembuh.'][h.st])}
  else if(k=='cancel'){S.hcb=null;ts('Kunjungan Home Care dibatalkan')}else if(k=='new')S.hcb=null}
 render()});
function render(){const sc=document.getElementById('sc');sc.className='sc '+(S.ch=='wa'?'wa':'ap');
 const ob=sc.querySelector('.ct'),sy=ob?ob.scrollTop:0,pt=S.pt;S.pt=S.tab;sc.innerHTML=S.ch=="wa"?waView():(S.user?appView():authView());const nb=sc.querySelector('.ct');if(nb&&pt===S.tab)nb.scrollTop=sy;document.getElementById("pn").innerHTML=panel();
 const c=document.getElementById("chat");if(c)c.scrollTop=c.scrollHeight}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab],[data-pk],[data-sd],[data-ac],[data-ch],[data-sim]");if(!b)return;const d=b.dataset;
 if(d.tab!==undefined){S.tab=+d.tab;S.toast=null;render()}
 else if(d.pk!==undefined)pick(d.pk);
 else if(d.sd){const i=document.getElementById("tx");if(i&&i.value.trim())send(i.value)}
 else if(d.ac)act(d.ac);
 else if(d.ch){S.ch=d.ch;render()}
 else if(d.sim=='arrive')arrive();else if(d.sim=='tick')tick();else if(d.sim=="next")next();else if(d.sim=='titip')titip();else if(d.sim=='step')step();else if(d.sim=="absent")absent();else if(d.sim=="reset")init()});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="tx"&&e.target.value.trim())send(e.target.value)});
init();
</script>
